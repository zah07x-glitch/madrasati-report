<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مولّد إنفوجرافيك التعليم عن بُعد – مدرستي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#E6ECEA;font-family:'Tajawal',Tahoma,sans-serif;color:#1F2A30}
.app{max-width:860px;margin:0 auto;padding:12px}
.panel{background:#fff;border-radius:16px;border:1px solid #D5DEDB;padding:14px;margin-bottom:12px}
.panel h2{margin:0 0 10px;font-size:18px;color:#12365F}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:#5B6770;font-weight:500}
input,select{font:inherit;font-size:16px;padding:10px;border:1px solid #B9C6C2;border-radius:10px;background:#fff;color:#1F2A30;min-height:44px;width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button,.fbtn{font:inherit;font-size:16px;font-weight:700;min-height:44px;padding:0 16px;border-radius:10px;border:0;background:#0E6B5C;color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
button.sec2,.fbtn.sec2{background:#fff;color:#12365F;border:1px solid #12365F}
.fbtn input{display:none}
.hint{font-size:13px;color:#5B6770;margin-top:6px}
#wrap{position:relative;margin:0 auto}
.p{position:absolute;top:0;left:0;transform-origin:0 0;font-family:'Tajawal',sans-serif;direction:rtl;width:794px;min-height:1123px;padding:24px 30px;background:#F4F7F6;color:#1F2A30;display:flex;flex-direction:column;gap:12px}
.hd{background:#12365F;border-radius:18px;padding:14px 20px;display:flex;align-items:center;gap:16px;color:#fff;height:128px}
.logo{width:112px;height:100px;border:2px dashed #9FB7D3;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;color:#C9D8EA;flex:none;overflow:hidden}.dv{width:2px;align-self:stretch;margin:4px 0;background:rgba(255,255,255,.28);flex:none}
.logo.has{border:0;background:#fff;padding:8px;box-shadow:0 3px 10px rgba(0,0,0,.25)}.li{width:100%;height:100%;background-repeat:no-repeat;background-position:center}
.hd h1{margin:0;font-size:25px;line-height:1.35;font-weight:800}
.hd small{display:block;font-size:15px;color:#C9D8EA;margin-bottom:4px}
.strip{display:flex;gap:10px;height:66px}
.chip{flex:1;background:#fff;border-radius:14px;border:1px solid #D5DEDB;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;color:#5B6770}
.chip b{font-size:21px;color:#12365F}
.chip.big{flex:1.5;background:#0E6B5C;border:0;color:#E1F2EE}
.chip.big b{font-size:40px;color:#fff;line-height:1}
.chip.big .u{font-size:18px;font-weight:700;color:#fff}
.sec{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;color:#12365F;margin:0 0 6px}
.sec:before{content:"";width:6px;height:20px;border-radius:3px;background:#0E6B5C}
.sec:after{content:"";flex:1;height:2px;background:#D5DEDB}
.kpis{display:flex;gap:10px}
.k{flex:1;background:#fff;border-radius:14px;border:1px solid #D5DEDB;padding:10px 6px;text-align:center;box-shadow:0 2px 6px rgba(18,54,95,.07)}
.k svg{width:26px;height:26px}.k b{display:block;font-size:34px;line-height:1.1;font-weight:800}.k span{font-size:15px;color:#5B6770}
.row{display:flex;gap:14px}
.card{background:#fff;border-radius:16px;border:1px solid #D5DEDB;padding:12px 16px;box-shadow:0 2px 6px rgba(18,54,95,.07)}
.ev{display:flex;flex-wrap:wrap;gap:10px}
.ph{width:calc(25% - 7.5px);text-align:center;font-size:14px;color:#5B6770;position:relative}
.ph .im{height:96px;border-radius:14px;background:#E3EBE8;border:2px dashed #9DB1AB;box-shadow:0 3px 8px rgba(0,0,0,.1);margin-bottom:5px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph .im.f{border:0}.ph .im img{width:100%;height:100%;object-fit:cover}
.ph input.cap{border:0;background:transparent;text-align:center;font-size:14px;color:#3F4B52;padding:2px;min-height:0;width:100%}
.ph .x{position:absolute;top:4px;right:4px;width:28px;height:28px;min-height:0;padding:0;border-radius:50%;background:#B5530F;font-size:16px}
ul{margin:0;padding:0;list-style:none;font-size:16px;line-height:1.5}
li{display:flex;gap:8px;margin-bottom:5px}
li:before{content:"";flex:none;width:10px;height:10px;border-radius:50%;margin-top:8px;background:#0E6B5C}
.rec li:before{background:#12365F;border-radius:3px}
.ft{margin-top:auto;border-top:2px solid #12365F;padding-top:8px;display:flex;justify-content:space-between;font-size:16px;font-weight:700;color:#12365F}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff}.app{padding:0;max-width:none}.panel{display:none}
 #wrap{width:auto!important;height:auto!important}.p{position:static;transform:none!important}
 .x{display:none}.ph .im:not(.f){border-color:#9DB1AB}
}
</style>
</head>
<body>
<div class="app">
 <div class="panel">
  <h2>بيانات التقرير</h2>
  <div class="grid">
   <label>اليوم<select id="day"><option>الأحد</option><option>الاثنين</option><option>الثلاثاء</option><option>الأربعاء</option><option>الخميس</option><option>الجمعة</option><option>السبت</option></select></label>
   <label>التاريخ (اختر من التقويم)<input id="gdate" type="date"><span id="hd" style="font-weight:700;color:#12365F"></span></label>
   <label>عدد الحصص المتزامنة<input id="lessons" type="number" min="0" inputmode="numeric"></label>
   <label>عدد الطلاب<input id="total" type="number" min="0" inputmode="numeric"></label>
   <label>الطلاب الحاضرون<input id="present" type="number" min="0" inputmode="numeric"></label>
   <label>عدد المعلمين<input id="tTotal" type="number" min="0" inputmode="numeric"></label>
   <label>المعلمون الحاضرون<input id="tPresent" type="number" min="0" inputmode="numeric"></label>
   <label>إعداد<input id="prep"></label>
   <label>مدير المدرسة<input id="principal"></label>
  </div>
  <div class="hint" id="msg" role="status"></div>
  <div class="hint">الغائبون ونسبة الحضور تُحسب تلقائياً. يُحوَّل التاريخ تلقائياً إلى الهجري (أم القرى) ويُحدَّد اليوم، ويمكنك تغيير اليوم يدوياً بعد ذلك.</div>
  <div class="btns">
   <label class="fbtn">إضافة شواهد (صور)<input id="addEv" type="file" accept="image/*" multiple></label>
   <label class="fbtn sec2">رفع الشعار<input id="addLogo" type="file" accept="image/*"></label>
   <button id="pdf">حفظ PDF للطباعة</button>
   <button class="sec2" id="png">حفظ كصورة PNG</button>
   <button class="sec2" id="reset">إعادة الضبط</button>
  </div>
 </div>
 <div id="wrap"><div class="p" id="sheet"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const DEF={day:'الاثنين',date:'١٤٤٨/٥/٢٩',gdate:'2026-11-09',lessons:56,total:177,present:170,tTotal:21,tPresent:21,prep:'عبدالله الزهراني',principal:'عثمان محمد مسملي',logo:'',ev:[]};
let S=Object.assign({},DEF,{ev:[]});
try{const r=localStorage.getItem('madrasati_v1');if(r)S=Object.assign({},DEF,JSON.parse(r))}catch(e){}
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>Math.max(0,Math.floor(Number(v)||0));
function save(){try{localStorage.setItem('madrasati_v1',JSON.stringify(S))}catch(e){try{localStorage.setItem('madrasati_v1',JSON.stringify(Object.assign({},S,{ev:[],logo:''})))}catch(e2){}}}
function cnt(n,one,two,few,many){return n==0?'':n==1?one:n==2?two:n<=10?ar(n)+' '+few:ar(n)+' '+many}
function render(){
 const t=num(S.total),p=Math.min(num(S.present),t),a=t-p,pct=t?p/t*100:0;
 const tt=num(S.tTotal),tp=Math.min(num(S.tPresent),tt),tpct=tt?tp/tt*100:0;
 const P=ar(pct.toFixed(1).replace('.','٫').replace('٫','.')).replace('.','٫');
 const TP=ar((Math.round(tpct*10)/10).toString().replace('.','٫').replace('٫','.')).replace('.','٫');
 const C=376.99,len=C*pct/100,L=num(S.lessons),D=esc(ar(S.date));
 const ab=cnt(a,'طالب واحد','طالبان','طلاب','طالباً');
 const sum='نُفّذت يوم '+esc(S.day)+' '+D+' هـ عدد '+ar(L)+' حصة متزامنة عبر منصة مدرستي، بحضور '+ar(p)+' طالباً من أصل '+ar(t)+' بنسبة '+P+'٪، وحضور '+ar(tp)+' من '+ar(tt)+' معلماً بنسبة '+TP+'٪، '+(a?'مع غياب '+ab+' فقط.':'دون تسجيل أي غياب بين الطلاب.');
 const n=Math.max(4,S.ev.length);let ev='';
 for(let i=0;i<n;i++){const e=S.ev[i];
  ev+=e?'<div class="ph"><div class="im f"><div class="li" style="background-image:url('+e.src+');background-size:cover"></div></div><input class="cap" data-i="'+i+'" value="'+esc(e.cap)+'"><button class="x" data-r="'+i+'" aria-label="حذف الصورة">×</button></div>'
   :'<div class="ph"><div class="im">مساحة صورة</div>شاهد '+ar(i+1)+' — '+['حصة متزامنة عبر مدرستي','تفاعل الطلاب في الحصة','متابعة الحضور','توثيق الحصص'][i%4]+'</div>';}
 const ic=(c,d)=>'<svg viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>';
 const chk='<circle cx="12" cy="12" r="9"/><path d="M7.5 12.5l3 3 6-7"/>';
 document.getElementById('sheet').innerHTML=
 '<div class="hd"><div class="logo'+(S.logo?' has':'')+'">'+(S.logo?'<div class="li" style="background-image:url('+S.logo+');background-size:contain"></div>':'شعار الوزارة')+'</div><div class="dv"></div><div><small>الإدارة العامة للتعليم بمنطقة جازان</small><h1>التعليم عن بُعد عبر منصة مدرستي في مدرسة الإمام أبو حنيفة الابتدائية بالمهدج</h1></div></div>'+
 '<div class="strip"><div class="chip">اليوم <b>'+esc(S.day)+'</b></div><div class="chip">التاريخ <b>'+D+' هـ</b></div><div class="chip big">الحصص المتزامنة <b>'+ar(L)+'</b><span class="u">حصة</span></div></div>'+
 '<div><div class="sec">المؤشرات الرئيسية</div><div class="kpis">'+
 '<div class="k">'+ic('#12365F','<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>')+'<b style="color:#12365F">'+ar(t)+'</b><span>عدد الطلاب</span></div>'+
 '<div class="k">'+ic('#0E6B5C',chk)+'<b style="color:#0E6B5C">'+ar(p)+'</b><span>الحاضرون</span></div>'+
 '<div class="k">'+ic('#B5530F','<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>')+'<b style="color:#B5530F">'+ar(a)+'</b><span>الغائبون</span></div>'+
 '<div class="k">'+ic('#12365F','<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>')+'<b style="color:#12365F">'+ar(tt)+'</b><span>عدد المعلمين</span></div>'+
 '<div class="k">'+ic('#0E6B5C',chk)+'<b style="color:#0E6B5C">'+ar(tp)+'</b><span>حضور المعلمين ('+TP+'٪)</span></div></div></div>'+
 '<div class="card row" style="align-items:center;height:150px"><svg width="130" height="130" viewBox="0 0 150 150" role="img" aria-label="نسبة حضور الطلاب"><circle cx="75" cy="75" r="60" fill="none" stroke="'+(t?'#B5530F':'#D5DEDB')+'" stroke-width="18"/><circle cx="75" cy="75" r="60" fill="none" stroke="#0E6B5C" stroke-width="18" stroke-dasharray="'+len.toFixed(1)+' '+C+'" transform="rotate(-90 75 75)"/><text x="75" y="82" text-anchor="middle" font-family="Tajawal" font-weight="800" font-size="27" fill="#12365F">'+P+'٪</text></svg>'+
 '<div style="flex:1"><div class="sec" style="margin-bottom:4px">نسبة حضور الطلاب</div><div style="font-size:17px;line-height:1.7">نسبة الحضور = ('+ar(p)+' ÷ '+ar(t)+') × ١٠٠ = <b style="color:#0E6B5C;font-size:24px">'+P+'٪</b></div>'+
 '<div style="font-size:15px;color:#5B6770;display:flex;gap:16px;margin-top:2px"><span><i style="display:inline-block;width:12px;height:12px;border-radius:3px;background:#0E6B5C"></i> حضور '+P+'٪</span><span><i style="display:inline-block;width:12px;height:12px;border-radius:3px;background:#B5530F"></i> غياب '+ar((t?100-pct:0).toFixed(1)).replace('.','٫')+'٪ ('+ar(a)+' طلاب)</span></div></div></div>'+
 '<div><div class="sec">الشواهد</div><div class="ev">'+ev+'</div></div>'+
 '<div class="row"><div class="card" style="flex:1"><div class="sec">أبرز المؤشرات</div><ul><li>حضور الطلاب '+P+'٪ ('+ar(p)+' من '+ar(t)+' طالباً)</li><li>حضور المعلمين '+TP+'٪ ('+ar(tp)+' من '+ar(tt)+')</li><li>'+ar(L)+' حصة متزامنة عبر منصة مدرستي</li><li>'+(a?'الغياب: '+ab+' ('+ar((100-pct).toFixed(1)).replace('.','٫')+'٪)':'لا يوجد غياب بين الطلاب')+'</li></ul></div>'+
 '<div class="card rec" style="flex:1"><div class="sec">أبرز التوصيات</div><ul><li>'+(a?'متابعة الطلاب الغائبين والتواصل مع أولياء أمورهم':'الحفاظ على مستوى الحضور المرتفع')+'</li><li>تعزيز التفاعل داخل الحصص المتزامنة</li><li>توثيق الشواهد أسبوعياً</li><li>استمرار المتابعة الإشرافية</li></ul></div></div>'+
 '<div class="card"><div class="sec" style="margin-bottom:4px">خلاصة التقرير</div><div style="font-size:16px;line-height:1.6">'+sum+'</div></div>'+
 '<div class="ft"><span>إعداد: '+esc(S.prep)+'</span><span>مدير المدرسة: '+esc(S.principal)+'</span></div>';
 fit();
}
function fit(){const w=document.getElementById('wrap'),s=document.getElementById('sheet');
 if(matchMedia('print').matches){return}
 const k=Math.min(1,(w.parentElement.clientWidth)/794);s.style.transform='scale('+k+')';
 w.style.width=794*k+'px';w.style.height=s.offsetHeight*k+'px'}
function hij(g){try{const p=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric',year:'numeric'}).formatToParts(new Date(g+'T12:00:00'));const v=t=>p.find(x=>x.type===t).value;return ar(v('year').replace(/\D/g,'')+'/'+v('month')+'/'+v('day'))}catch(e){return ''}}
function showH(){document.getElementById('hd').textContent=S.date?'الموافق: '+ar(S.date)+' هـ':''}
function sync(){document.getElementById('gdate').value=S.gdate||'';showH();for(const k of ['day','lessons','total','present','tTotal','tPresent','prep','principal'])document.getElementById(k).value=S[k]}
sync();
for(const k of ['day','lessons','total','present','tTotal','tPresent','prep','principal']){
 const el=document.getElementById(k);
 el.addEventListener('input',()=>{S[k]=el.value;save();render()});
 el.addEventListener('change',()=>{if(['present','tPresent'].includes(k)){const m=num(S[k==='present'?'total':'tTotal']);if(num(S[k])>m){S[k]=m;el.value=m}}render();save()});
}
document.getElementById('gdate').addEventListener('input',e=>{const g=e.target.value;if(!g)return;S.gdate=g;const h=hij(g);if(h)S.date=h;S.day=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][new Date(g+'T12:00:00').getDay()];document.getElementById('day').value=S.day;showH();save();render()});
function shrink(file,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(file)}
document.getElementById('addEv').addEventListener('change',e=>{const fs=[...e.target.files];let d=0;fs.forEach(f=>shrink(f,900,u=>{S.ev.push({src:u,cap:'شاهد '+ar(S.ev.length+1)+' — '});if(++d===fs.length){save();render()}}));e.target.value=''});
document.getElementById('addLogo').addEventListener('change',e=>{const f=e.target.files[0];if(f)shrink(f,700,u=>{S.logo=u;save();render()});e.target.value=''});
document.getElementById('sheet').addEventListener('click',e=>{const r=e.target.getAttribute('data-r');if(r!==null){S.ev.splice(+r,1);save();render()}});
document.getElementById('sheet').addEventListener('input',e=>{const i=e.target.getAttribute('data-i');if(i!==null&&S.ev[i]){S.ev[i].cap=e.target.value;save()}});
const msg=t=>{document.getElementById('msg').textContent=t};
async function snap(){
 const s=document.getElementById('sheet'),w=document.getElementById('wrap'),keep=s.style.transform,ww=w.style.width,wh=w.style.height;
 s.style.transform='none';
 try{if(document.fonts)await document.fonts.ready;return await html2canvas(s,{scale:2,backgroundColor:'#F4F7F6',useCORS:true})}
 finally{s.style.transform=keep;w.style.width=ww;w.style.height=wh}
}
async function saveFile(kind){
 msg('جارٍ التجهيز…');
 try{
  const dl=window.claude?await claude.use('downloads'):{save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}};
  if(!dl){msg('الحفظ غير متاح هنا. افتح الصفحة من claude.ai.');return}
  await new Promise(r=>setTimeout(r,150));const c=await snap(),name='تقرير-مدرستي-'+(S.date||'').replace(/[^0-9\u0660-\u0669]+/g,'-');
  if(kind==='png'){const b=await new Promise(r=>c.toBlob(r,'image/png'));await dl.save({filename:name+'.png',data:b})}
  else{
   const H=210*c.height/c.width,J=window.jspdf.jsPDF,d=new J({unit:'mm',format:H>297?[210,H]:'a4',orientation:'portrait'});
   d.addImage(c.toDataURL('image/jpeg',.95),'JPEG',0,0,210,H);
   await dl.save({filename:name+'.pdf',data:d.output('arraybuffer')});
  }
  msg('تم الحفظ.');
 }catch(e){msg(e&&e.code==='declined'?'تم إلغاء الحفظ.':'تعذّر الحفظ، حاول مرة أخرى.')}
}
document.getElementById('pdf').onclick=()=>saveFile('pdf');
document.getElementById('png').onclick=()=>saveFile('png');
document.getElementById('reset').onclick=()=>{if(confirm('إعادة جميع البيانات والصور إلى الوضع الافتراضي؟')){S=Object.assign({},DEF,{ev:[]});save();sync();render()}};
addEventListener('resize',fit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
render();
</script>
</body>
</html>
